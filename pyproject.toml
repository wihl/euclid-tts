[project]
name = "euclid-tts"
version = "0.1.0"
description = "A bounded Euclid I.23 Erasmian / Modern Greek TTS experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "onnxruntime>=1.20,<2",
  "huggingface-hub>=0.30,<2",
  "google-auth>=2.38,<3",
  "requests>=2.32,<3",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/euclid_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
